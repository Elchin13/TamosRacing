<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Гран-при школьных автобусов</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#244d24;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#eef2f7;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.panel{position:fixed;background:rgba(14,18,26,.84);border:1px solid rgba(255,255,255,.09);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#top{left:12px;top:12px;padding:10px 14px;min-width:210px}
#top h1{margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#ffd24a}
#top .big{font-size:26px;font-weight:700;line-height:1}
#top .sm{font-size:12px;color:#aab4c3;margin-top:4px}
#flc{color:#c78bff}
#lights{position:fixed;left:50%;top:14px;transform:translateX(-50%);display:none;gap:10px;padding:10px 16px}
#lights i{width:26px;height:26px;border-radius:50%;background:#2a2020;border:2px solid #111;display:block}
#lights i.on{background:#ff2a2a;box-shadow:0 0 14px #ff2a2a}
#flag{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:8px 18px;font-weight:800;letter-spacing:.08em;font-size:14px;text-transform:uppercase;display:none;border-radius:10px;border:2px solid;white-space:nowrap;z-index:3}
#flag.y{background:#f5c518;color:#1a1500;border-color:#fff2a0;animation:blink 1s steps(2) infinite}
#flag.sc{background:#f5c518;color:#1a1500;border-color:#fff}
#flag.g{background:#17a34a;color:#fff;border-color:#86efac}
#flag.ch{background:#fff;color:#111;border-color:#111;background-image:repeating-conic-gradient(#111 0 25%,#fff 0 50%);background-size:16px 16px;text-shadow:0 0 4px #fff,0 0 4px #fff}
@keyframes blink{50%{opacity:.55}}
#board{right:12px;top:12px;width:300px;padding:8px}
#board h2,#logp h2,#radiop h2{margin:2px 4px 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#aab4c3}
#rows{position:relative;height:300px}
.row{position:absolute;left:0;right:0;height:28px;display:flex;align-items:center;gap:5px;padding:0 6px;border-radius:7px;font-size:13px;transition:transform .45s ease;cursor:pointer;box-sizing:border-box}
.row:hover{background:rgba(255,255,255,.08)}
.row.sel{background:rgba(255,210,74,.18);outline:1px solid rgba(255,210,74,.6)}
.row.out{opacity:.45}
.row .pos{width:18px;text-align:right;font-weight:700;color:#cfd7e3}
.row .chip{width:24px;height:18px;border-radius:4px;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #0008}
.row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tyre{width:17px;height:17px;border-radius:50%;border:3px solid #fff;box-sizing:border-box;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#111;background:#222}
.row .tyre.pit{outline:2px solid #60a5fa}
.row .gp{width:52px;text-align:right;font-variant-numeric:tabular-nums;color:#c4cddb;font-size:12px}
.row .chg{width:24px;font-size:11px}
.up{color:#4ade80}.dn{color:#f87171}
#logp{right:12px;top:372px;width:300px;padding:8px;max-height:calc(100vh - 470px)}
#log{overflow:hidden;font-size:12px;line-height:1.35;max-height:calc(100vh - 510px)}
#log div{padding:2px 4px;border-left:3px solid #556;margin-bottom:2px}
#log .pass{border-color:#4ade80}#log .lead{border-color:#ffd24a;color:#ffe9a0}#log .err{border-color:#fb923c}
#log .hit{border-color:#f87171}#log .pen{border-color:#ef4444;color:#fca5a5}#log .fl{border-color:#c78bff;color:#e0c2ff}#log .info{border-color:#60a5fa}
#log .sc{border-color:#f5c518;color:#fde68a;font-weight:700}#log .crash{border-color:#ef4444;color:#fecaca;font-weight:700}#log .team{border-color:#2dd4bf;color:#99f6e4}#log .pit{border-color:#38bdf8}
#radiop{left:12px;bottom:156px;width:330px;padding:8px 10px;max-width:calc(100vw - 340px)}
#radio{font-size:12px;line-height:1.35}
.msg{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06);animation:slide .35s ease}
.msg:last-child{border-bottom:0}
.msg .tg{flex:none;min-width:26px;height:16px;border-radius:4px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px;padding:0 3px}
.msg .who{font-weight:700;color:#fff}
.msg .tx{color:#d4dbe7}
.msg.eng .tx{color:#9fb4d1}
.msg.old{opacity:.55}
@keyframes slide{from{opacity:0;transform:translateY(8px)}}
#ctrl{left:50%;bottom:12px;transform:translateX(-50%);padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;max-width:calc(100vw - 460px)}
button{background:#263145;color:#eef2f7;border:1px solid #3a475f;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
button:hover{background:#34425c}button.act{background:#ffd24a;color:#1a1a1a;border-color:#ffd24a;font-weight:700}
.sep{width:1px;height:20px;background:#3a475f;margin:0 4px}
#mini{left:12px;bottom:12px;padding:6px}
#mini canvas{display:block;border-radius:8px}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);padding:10px 20px;font-size:17px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:60vw}
#toast.show{opacity:1}
.ov{position:fixed;inset:0;background:rgba(8,12,18,.82);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px;box-sizing:border-box;z-index:10}
.ov .box{background:#121821;border:1px solid #2a3446;border-radius:16px;max-width:1080px;width:100%;padding:22px 26px;box-shadow:0 10px 50px #000a}
.ov h1{margin:0 0 4px;font-size:26px;color:#ffd24a}
.ov p.sub{margin:0 0 14px;color:#aab4c3;font-size:14px}
.cols{display:grid;grid-template-columns:320px 1fr;gap:20px}
@media(max-width:800px){.cols{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:4px 6px;text-align:left;border-bottom:1px solid #263145}
th{color:#8f9bb0;font-weight:600;font-size:11px;text-transform:uppercase}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.chipS{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.tdot{display:inline-block;width:13px;height:13px;border-radius:50%;border:3px solid #fff;box-sizing:border-box;vertical-align:-2px;margin-right:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:#182030;border:1px solid #2a3446;border-radius:10px;padding:10px;font-size:12px;color:#b8c2d1}
.card b{color:#fff;font-size:14px}.card .tm{font-size:11px;margin-bottom:4px}
.bar{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:10px;color:#8f9bb0}
.bar span{width:62px}.bar i{display:block;height:5px;border-radius:3px;background:#ffd24a}.bar u{flex:1;height:5px;background:#2a3446;border-radius:3px;display:block;text-decoration:none}
.btns{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.btns button{padding:10px 18px;font-size:14px}.btns .go{background:#ffd24a;color:#111;font-weight:700;border-color:#ffd24a}
.win{font-size:20px;margin:6px 0 12px}
/* меню */
#menu{background:radial-gradient(ellipse at 50% 30%,#1f4d2a 0%,#0d1a12 70%);align-items:center;display:flex}
#menu .box{background:transparent;border:0;box-shadow:none;text-align:center;max-width:760px;margin:auto}
#menu .logo{font-size:clamp(34px,7vw,64px);font-weight:900;line-height:1.02;color:#ffd24a;letter-spacing:.01em;text-shadow:0 4px 0 #8a5a00,0 10px 30px #000a}
#menu .logo small{display:block;font-size:.34em;letter-spacing:.35em;color:#f4f6fa;text-shadow:none;margin-bottom:10px;font-weight:700}
#menu .bus{margin:26px auto 8px;width:min(420px,80vw)}
#menu p{color:#b8c2d1;font-size:15px;line-height:1.5;margin:10px auto;max-width:560px}
#menu .btns{justify-content:center}
#menu .btns button{font-size:18px;padding:14px 30px;border-radius:12px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:10px}
.tcard{background:#182030;border:1px solid #2a3446;border-radius:12px;padding:10px;cursor:pointer;transition:transform .15s,border-color .15s;text-align:left}
.tcard:hover{transform:translateY(-3px);border-color:#ffd24a}
.tcard canvas{width:100%;height:120px;display:block;background:#1f4d27;border-radius:8px}
.tcard h3{margin:8px 0 2px;font-size:16px;color:#fff;display:flex;justify-content:space-between;align-items:baseline}
.tcard h3 em{font-style:normal;font-size:12px;color:#ffd24a}
.tcard p{margin:4px 0 6px;font-size:12px;color:#aab4c3;line-height:1.35;min-height:48px}
.tcard .bar span{width:84px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.seedrow{font-size:12px;color:#8f9bb0;display:flex;gap:6px;align-items:center}
.seedrow input{background:#0e131b;border:1px solid #3a475f;color:#fff;border-radius:6px;padding:4px 8px;width:110px;font-family:inherit}
.stratrow td{font-size:12px}
.alm{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.alm .card{padding:14px;font-size:13px;line-height:1.45}.alm h3{margin:0;color:#fff;font-size:17px}.alm .ti{color:#ffd24a;font-weight:700;margin:2px 0}.alm .yr{font-size:11px;color:#8f9bb0;margin-bottom:6px}.alm ul{margin:6px 0 0;padding-left:18px;color:#9fb4d1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel" id="top"><h1 id="trname">Гран-при школьных автобусов</h1><div class="big" id="lap">Круг 1/25</div><div class="sm" id="rtime">0:00.0</div><div class="sm" id="flc">Лучший круг: —</div><div class="sm" id="seedl"></div></div>
<div class="panel" id="lights"><i></i><i></i><i></i><i></i><i></i></div>
<div id="flag"></div>
<div class="panel" id="board"><h2>Положение</h2><div id="rows"></div></div>
<div class="panel" id="logp"><h2>События гонки</h2><div id="log"></div></div>
<div class="panel" id="radiop"><h2>Радио команд</h2><div id="radio"></div></div>
<div class="panel" id="mini"><canvas id="mc" width="190" height="130"></canvas></div>
<div class="panel" id="ctrl">
<button id="bPause">Пауза</button><span class="sep"></span>
<button data-sp="0.5">0.5×</button><button data-sp="1" class="act">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button><button data-sp="8">8×</button><span class="sep"></span>
<button data-cm="auto" class="act">Режиссёр</button><button data-cm="leader">Лидер</button><button data-cm="follow">Выбранный</button><button data-cm="full">Вся трасса</button><span class="sep"></span>
<button id="zm">−</button><button id="zp">+</button><span class="sep"></span><button id="bRadio">Радио: вкл</button><button id="bCrash" title="Спровоцировать аварию, чтобы увидеть машину безопасности">⚠ Авария</button><button id="bMenu">☰ Меню</button>
</div>
<div class="panel" id="toast"></div>
<div class="ov" id="menu"><div class="box"></div></div>
<div class="ov" id="tracks"><div class="box"></div></div>
<div class="ov" id="intro"><div class="box"></div></div>
<div class="ov" id="alm"><div class="box"></div></div>
<div class="ov" id="res"><div class="box"></div></div>

<script>

// ===DATA_START===
const CFG={LAPS:25,W:120,CAR_L:42,CAR_W:17,VMAX:345,VPROF_CAP:520,ALAT:330,BRAKE_PROF:360,BRAKE_MAX:560,ACC:105,DT:1/60,STEP:8,
  PIT_LIMIT:165,SC_SPEED:165};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function gauss(r){let u=0;while(u===0)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function wrapPi(a){while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;}
function fmtLap(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+s.toFixed(3).padStart(6,'0');}

// lead: ключ главного гонщика команды (или null), plan: насколько команда склонна к командным приказам 0..1, crew: скорость механиков
const TEAMS=[
 {name:'Гасырлам-Высокий',color:'#ff8a1f',lead:'gas',plan:.65,crew:.55},
 {name:'Старый Весельчак-Бигги',color:'#a45cf0',lead:null,plan:.25,crew:.6},
 {name:'Куаныш-Аза',color:'#ef3b3b',lead:'kua',plan:.9,crew:.75},
 {name:'Зеленая Шляпа-Айбек',color:'#22c55e',lead:null,plan:.5,crew:.85},
 {name:'Шофер-Изгой',color:'#2f8cff',lead:'sho',plan:.75,crew:.5}
];
// power - скорость машины, corner - повороты, start - старт, ovt - мастерство обгона, aggr - готовность атаковать,
// risk - риск, def - защита, cons - стабильность, dur - износ машины, iq - трассовый ум, caut - излишняя осторожность,
// clutch - хладнокровие, burst - порывы, agil - манёвренность, quali - один круг, rel - надёжность, chaos - хаотичность,
// hes - торможения/неуверенность, fade - возрастная усталость, tyre - бережность к шинам, loyal - готовность помогать партнёру
const DRIVERS=[
 {key:'gas',name:'Гасырлам',team:0,num:11,second:false,titles:1,power:.77,corner:.84,start:.60,ovt:.80,aggr:.70,risk:.40,def:.60,cons:.78,dur:.80,iq:.70,caut:.10,clutch:.55,burst:0,agil:.95,quali:.72,rel:.90,chaos:.10,hes:0,fade:0,tyre:.60,loyal:.45,
  desc:'Очень быстрый и изворотливый. Находит лазейки там, где их нет.'},
 {key:'vys',name:'Высокий',team:0,num:21,second:true,titles:0,power:.62,corner:.70,start:.55,ovt:.64,aggr:.85,risk:.55,def:.60,cons:.72,dur:.60,iq:.60,caut:.05,clutch:.60,burst:.9,agil:.80,quali:.55,rel:.80,chaos:.20,hes:0,fade:0,tyre:.50,loyal:.80,
  desc:'Слабейшая машина в пелотоне, но выгрызает позиции напором и редкими порывами.'},
 {key:'ves',name:'Старый Весельчак',team:1,num:13,second:false,titles:1,power:.76,corner:.80,start:.55,ovt:.85,aggr:.95,risk:.90,def:.50,cons:.60,dur:.75,iq:.55,caut:0,clutch:.50,burst:0,agil:.90,quali:.70,rel:.86,chaos:.95,hes:0,fade:0,tyre:.35,loyal:.35,
  desc:'Идёт в опасные обгоны, хаотичные, но эффективные движения.'},
 {key:'big',name:'Бигги',team:1,num:31,second:true,titles:0,power:.75,corner:.80,start:.60,ovt:.60,aggr:.55,risk:.25,def:.95,cons:.86,dur:.92,iq:.75,caut:.10,clutch:.95,burst:0,agil:.60,quali:.70,rel:.93,chaos:0,hes:0,fade:0,tyre:.70,loyal:.60,
  desc:'Крепкий, отлично обороняется, хладнокровен и быстр, когда надо.'},
 {key:'kua',name:'Куаныш',team:2,num:7,second:false,titles:4,power:.865,corner:.925,start:.22,ovt:.95,aggr:.72,risk:.35,def:.60,cons:.86,dur:.85,iq:.82,caut:.10,clutch:.55,burst:0,agil:.80,quali:.82,rel:.93,chaos:.10,hes:0,fade:0,tyre:.65,loyal:.30,
  desc:'Самый быстрый, мастер обгона. Слабоват старт. 4-кратный чемпион.'},
 {key:'aza',name:'Аза',team:2,num:17,second:true,titles:0,power:.78,corner:.83,start:.97,ovt:.55,aggr:.40,risk:.15,def:.65,cons:.88,dur:.85,iq:.80,caut:.70,clutch:.50,burst:0,agil:.65,quali:.70,rel:.92,chaos:0,hes:0,fade:0,tyre:.85,loyal:.85,
  desc:'Хороший темп и отличный старт, но бывает слишком аккуратен в обгонах.'},
 {key:'zsh',name:'Зеленая Шляпа',team:3,num:1,second:false,titles:4,power:.74,corner:.80,start:.50,ovt:.72,aggr:.45,risk:.10,def:.80,cons:.96,dur:.90,iq:.97,caut:.15,clutch:.60,burst:0,agil:.70,quali:.62,rel:.92,chaos:0,hes:0,fade:1,tyre:.92,loyal:.65,
  desc:'Ветеран, первый чемпион. Расчётлив, аккуратен, умён, но с годами чуть сдал.'},
 {key:'aib',name:'Айбек',team:3,num:5,second:true,titles:1,power:.83,corner:.86,start:.60,ovt:.75,aggr:.55,risk:.12,def:.75,cons:.93,dur:.88,iq:.93,caut:.15,clutch:.60,burst:0,agil:.75,quali:.75,rel:.93,chaos:0,hes:0,fade:0,tyre:.85,loyal:.60,
  desc:'Преемник Зеленой Шляпы: техничен, умён, быстрая машина.'},
 {key:'sho',name:'Шофер',team:4,num:9,second:false,titles:0,power:.915,corner:.89,start:.60,ovt:.86,aggr:.80,risk:.55,def:.60,cons:.75,dur:.50,iq:.75,caut:0,clutch:.60,burst:0,agil:.80,quali:.72,rel:.70,chaos:.20,hes:0,fade:0,tyre:.42,loyal:.25,
  desc:'Король одного круга и соло-проходов. На дистанции машина может сдавать.'},
 {key:'izg',name:'Изгой',team:4,num:66,second:true,titles:0,power:.86,corner:.68,start:.50,ovt:.47,aggr:.45,risk:.50,def:.55,cons:.60,dur:.80,iq:.52,caut:.10,clutch:.42,burst:0,agil:.55,quali:.62,rel:.86,chaos:.10,hes:.55,fade:0,tyre:.55,loyal:.70,
  desc:'Хорошая машина, но часто ошибается и тормозит. Слаб в обгонах и поворотах.'}
];
// шины: pace - прибавка скорости свежего комплекта, life - ресурс в кругах (до "обрыва"), cliff - сила обрыва
const TYRES={
 S:{key:'S',name:'Софт',color:'#ef4444',pace:.0110,life:15,cliff:.30},
 M:{key:'M',name:'Медиум',color:'#f5c542',pace:.0055,life:26,cliff:.24},
 H:{key:'H',name:'Хард',color:'#f1f5f9',pace:0,life:40,cliff:.18}
};
// потеря скорости от износа w (0..1.3)
function tyreLoss(comp,w){const t=TYRES[comp];return .011*Math.min(w,1)+t.cliff*Math.pow(Math.max(0,w-.82),2)*1.4;}
// ===DATA_END===

// ===TRACKS_START===
// diff - сложность, ovt - возможность обгона, spd - скорость (1..5) — только для карточек меню
const TRACKS=[
 {id:15,name:'15 кабинет',laps:25,W:120,grip:1,vmaxK:1,wearK:1,errK:1,bumpy:0,draft:1,passK:1,diff:3,ovt:3,spd:3,
  desc:'Классика. Сбалансированная трасса с длинной стартовой прямой — с неё всё и начиналось.',
  ctrl:[[1000,300],[1600,270],[2200,290],[2600,420],[2820,700],[2700,1000],[2380,1080],[2180,1280],[2380,1520],[2150,1760],[1600,1810],[1150,1710],[900,1470],[1150,1220],[1500,1160],[1250,870],[800,920],[520,1200],[260,1000],[250,620],[470,390]]},
 {id:12,name:'12 кабинет',laps:35,W:108,grip:.97,vmaxK:.98,wearK:1.25,errK:1.35,bumpy:.15,draft:1,passK:1.1,diff:5,ovt:4,spd:3,
  desc:'Одна из самых трудных и агрессивных трасс: шпильки, связки, поздние торможения. Шины горят, ошибки наказываются.',

function resampleClosed(P,S){
  const n=P.length,cum=[0];
  for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];cum.push(cum[i]+Math.hypot(b[0]-a[0],b[1]-a[1]));}
  const L=cum[n],N=Math.max(16,Math.round(L/S)),step=L/N,out=[];let j=0;
  for(let k=0;k<N;k++){const t=k*step;while(j<n-1&&cum[j+1]<t)j++;const a=P[j],b=P[(j+1)%n];const f=(t-cum[j])/Math.max(1e-9,cum[j+1]-cum[j]);out.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]);}
  return{pts:out,step,L};
}

    for(let q=0;q<30;q++){const t=q/30,t2=t*t,t3=t2*t;
      dense.push([0.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),

  r=resampleClosed(P,CFG.STEP);P=r.pts;

  for(let i=0;i<N;i++){X[i]=P[i][0];Y[i]=P[i][1];}
  for(let i=0;i<N;i++){const a=(i+1)%N,b=(i-1+N)%N;TH[i]=Math.atan2(Y[a]-Y[b],X[a]-X[b]);TX[i]=Math.cos(TH[i]);TY[i]=Math.sin(TH[i]);}

  {let va=0;for(let i=0;i<N;i++)va+=Math.min(vprof[i],CFG.VMAX*T.vmaxK);va/=N;T.lapEst=L/va*1.05;}

    o.x=x-ty*d;o.y=y+tx*d;o.th=Math.atan2(ty,tx);return o;};
  return T;
}

World.prototype.pickSide=function(c,blk){
  const CW=CFG.CAR_W,CL=CFG.CAR_L,DLIM=CFG.W/2-11,D=c.D,rng=this.rng,T=this.T;
  const kA=T.at(T.ks,c.s+130);let best=null,bs=-1e9;
  for(const side of[1,-1]){
    const gl=3+(1-D.risk)*4+D.caut*4,dc=blk.o.d+side*(CW+gl);
    if(Math.abs(dc)>DLIM+3)continue;
    let ok=true;
    for(const o of this.cars){if(o===c||o===blk.o||o.gone)continue;let ds=o.dist-c.dist;ds-=Math.round(ds/T.L)*T.L;if(Math.abs(ds)<CL+30&&Math.abs(o.d-dc)<CW+5){ok=false;break;}}
    if(!ok)continue;
    let sc=0;if(kA*side>.001)sc+=1*(.5+D.iq*.5);if(Math.sign(blk.o.d-c.d)===side)sc+=.3;
    sc+=(DLIM-Math.abs(dc))/80;sc+=rng()*(.3+D.chaos);
    if(sc>bs){bs=sc;best={side,gl,dc};}
  }
  return best;
};
World.prototype.controlWreck=function(c,dt){
  c.dnfT+=dt;c.vT=0;c.tgt=c.wreckSide*(CFG.W/2+24);c.braking=true;
  if(c.dnfT>32)c.gone=true;
};
World.prototype.startService=function(c){
  const pt=c.pit,crew=TEAMS[c.team].crew;
  pt.svc=1.8+(1-crew)*1.2+this.rng()*.8;pt.slow=false;
  if(this.rng()<.05*(1.4-crew)){pt.svc+=3+this.rng()*3.5;pt.slow=true;this.log('Задержка в боксах у '+c.name+'!','err');this.say('slow',c,'eng',1,null,1);}
  for(let i=0;i<8;i++)this.fx.push({type:'spark',x:c.x,y:c.y});
};
// вероятность командного приказа (в секунду) и допустимость
World.prototype.teamOrderProb=function(c,mate,freeV){
  const tm=TEAMS[c.team],plan=tm.plan;
  if(this.laps-c.lapNow<=4||c.lapNow<4)return 0;
  const adv=freeV-mate.v;
  if(adv<9)return 0;
  for(const o of this.cars){if(o===c||o===mate||o.gone||o.dnf||o.team===c.team)continue;const ds=this.normDs(mate.dist,o.dist);if(ds>0&&ds<CFG.CAR_L+60)return 0;}
  // угроза от соперника, который сидит на хвосте у напарника
  for(const o of this.cars){if(o===c||o===mate||o.gone||o.dnf||o.team===c.team)continue;const ds=this.normDs(o.dist,mate.dist);if(ds>0&&ds<CFG.CAR_L+34&&Math.abs(o.d-mate.d)<CFG.CAR_W*2)return 0;}
  if(tm.lead===c.D.key)return plan*.14*(.35+.65*clamp(adv/20,0,1));
  if(tm.lead===null)return adv>18?plan*.08*clamp(adv/30,0,1):0;
  return adv>40?plan*.015:0;
};
World.prototype.control=function(c,dt){

  if(c.dnf){this.controlWreck(c,dt);return;}
  const s=c.s,k=T.at(T.ks,s),isRace=this.mode==='race';
  const go=this.phase==='race'&&this.t>=c.goAt;

  const rp=this.relPos(c.dist);

        if(refuse){this.say('order',mate,'eng',2,{n:mate.name,m:c.name},1);this.sayLater(2,'letby',mate,'drv',2,null,.7);this.log('Командный приказ: '+mate.name+' не торопится пропускать '+c.name,'info');}
        else{

          mate.st.yield={to:c,t:7,t0:7,side:ysd};
          st.pass={o:mate,side:-ysd,gl:5,t:6,done:0,lb:1,feint:0,order:true};
          this.stats.swaps++;
          this.log('Командный приказ: '+mate.name+' пропускает '+c.name,'team');
          this.say('order',mate,'eng',2,{n:mate.name,m:c.name},1);
          this.sayLater(2.2,'letby',mate,'drv',2,{n:c.name},.9);
        }
      }
    }else if(!blk||blk.o!==mate)st.stuckT=0;
    // атака
    if(st.pass){
      const p=st.pass;let ds=p.o.dist-c.dist;ds-=Math.round(ds/L)*L;const real=ds*Math.max(.4,1-.5*(c.d+p.o.d)*k);
      p.t-=dt;
      if(real<-(CL+8)){p.done+=dt;if(p.done>.5){st.pass=null;st.passCd=1.5;}}
      else if(p.t<=0||real>230||p.o.gone||p.o.dnf){st.pass=null;st.passCd=1;}
      if(st.pass){let sd=p.side;if(p.feint>0){p.feint-=dt;sd=-sd;}tgt=clamp(p.o.d+sd*(CW+p.gl),-DLIM,DLIM);}
    }else{
      const range=((70+95*D.aggr)*(1-.3*D.caut)+(st.burstT>0?30:0))*(.75+.25*T.passK);
      if(blk&&blk.gap<range&&st.passCd<=0&&this.raceT>5&&!blk.o.dnf&&!blk.o.inPit&&(Math.abs(k)<.0048||D.chaos>.5)){
        st.followT+=dt;
        const same=blk.o.team===c.team;
        const thr=.6*(.25+1.8*D.caut+(1-D.aggr)*1+(st.burstT>0?-.4:0))/Math.max(.5,T.passK)+(same?1.6:0);
        const can=freeV>blk.o.v-1+(same?5:0);
        if(st.followT>thr&&(can||rng()<D.aggr*dt*.6*(same?.3:1))){
          const sd=this.pickSide(c,blk);
          if(sd){st.pass={o:blk.o,side:sd.side,gl:sd.gl+(same?3:0),t:3.4+1.6*rng(),done:0,lb:1+(same?0:D.risk*.06*(.4+.8*rng())),feint:(!same&&D.chaos>.3&&rng()<D.chaos*.5)?.3:0};st.followT=0;}
          else st.passCd=.7;
        }

    }
    // защита
    if(!st.pass){
      if(st.defT>0){
        st.defT-=dt;

      }else{

        let guard=0;
        if(mateOk&&TEAMS[c.team].lead===mate.D.key&&c.D.key!==mate.D.key){const dm=this.normDs(c.dist,mate.dist);if(dm>0&&dm<260)guard=1.2*D.loyal*TEAMS[c.team].plan;}
        if(chaser&&chaser.gap<42&&Math.abs(chaser.dd)<CW*1.8&&st.defCd<=0&&rng()<D.def*dt*2.2*(1+guard)*(sameCh?.2:1)){
          const kA=T.at(T.ks,s+130);let dD=chaser.o.d;

          st.defD=clamp(dD,-DLIM,DLIM);st.defT=.9+.7*rng();st.defCd=2.4+1.8*(1-D.def)+rng();

      }
    }

  let pitTgt=null;

      if(!inLane&&rp>this.PIT_LIM0+240){pt.ph=0;pitTgt=null;pitV=1e9;c.inPit=false;}
      if(pt.ph===1&&rem<=3&&c.v<8&&Math.abs(c.d-this.pitD2)<9){pt.ph=2;this.startService(c);}
      if(rp>pt.boxPos+60){pt.ph=3;}
    }else if(pt.ph===2){
      pitTgt=this.pitD2;pitV=0;pt.svc-=dt;c.stats.pitTime+=dt;
      if(pt.svc<=0){
        let unsafe=false;
        for(const o of this.cars){if(o===c||o.gone||!o.pit.ph||o.pit.ph===2)continue;const ds=this.normDs(o.dist,c.dist);if(ds>-110&&ds<45&&o.v>20&&Math.abs(o.d-this.pitD1)<20){unsafe=true;break;}}

      }

    }else if(pt.ph===4){

        if(false){pt.hold+=dt;pitV=0;pitTgt=this.pitD1;}else pt.rel=1;
      }
      if(pt.rel){
        if(Math.abs(c.d)<CFG.W/2-8&&rp>=this.PIT_LIM1-40||rp>this.PIT_LIM1+260){pt.ph=0;pt.rel=0;pt.hold=0;c.inPit=false;}
      }else pitTgt=this.pitD1;
    }

  }
  // правила: не сжимать соседей
  const lim=pitTgt!=null||c.inPit?Math.abs(this.pitD2)+8:DLIM;

    else{if(sgn>0)lo=Math.max(lo,Math.min(c.d,sd.o.d+need));else hi=Math.min(hi,Math.max(c.d,sd.o.d-need));}
    if(sd.core&&sd.real>0&&Math.abs(rel)<need*.92)yieldCap=Math.min(yieldCap,Math.max(0,sd.o.v-6));
  }
  if(lo>hi){tgt=c.d;yieldCap=Math.min(yieldCap,Math.max(0,c.v-10));}
  else tgt=clamp(tgt,lo,hi);
  if(!c.inPit&&Math.abs(c.d)>DLIM+2&&!c.off2)tgt=Math.sign(c.d)*DLIM*.85;
  else if(!c.inPit&&Math.abs(c.d)>DLIM+2)tgt=Math.sign(c.d)*DLIM*.85;
  if(go&&!c.finished&&c.v<3&&pt.ph!==2&&st.spinT<=0)c.stillT=(c.stillT||0)+dt;else c.stillT=0;

  c.tgt=tgt;
  c.vT=go?Math.min(vT,Math.max(yieldCap,26)):0;

World.prototype.mistake=function(c){
  const st=c.st,D=c.D,rng=this.rng;

    const risk=(this.raceT<16?.3:1)*.7*(.002+.03*Math.pow(1-D.cons,2)+.012*D.risk)*this.T.errK*(1+Math.max(0,c.over-1.03)*8)*(c.tyreW>.9?1.4:1);

  }

  if(c.over>1.05&&rng()<.18&&(D.risk>.4||D.cons<.6)){
    st.spinT=1.7;this.log(c.name+' теряет управление и разворачивается!','err');this.fx.push({type:'smoke',x:c.x,y:c.y});c.tyreW+=.03;return;
  }

    if(c.pos<=6||rng()<.4)this.log(c.name+' ошибся и вынесен на внешнюю','err');}
  else if(r<.82){st.mistT=.7;st.mistV=.86;st.mistDrift=14;st.mistKind='lock';c.tyreW+=.03;this.log('Блокировка колёс у '+c.name,'err');}

World.prototype.step=function(dt){
  this.t+=dt;this.tick++;
  if(this.phase==='lights'){this.lightT+=dt;this.lightsOn=Math.min(5,Math.floor(this.lightT/.9));if(this.lightT>=4.5+this.goHold)this.begin();}
  if(this.phase==='race')this.raceT=this.t-this.goT;
  const T=this.T;
  for(const c of this.cars)if(!c.gone)c.s=T.wrap(c.dist+T.startS);
  this.updateOrder();
  if(this.mode==='race'){
    this.scStep(dt);
    if(this.yellow.t>0)this.yellow.t-=dt;
    if(this.flagT>0)this.flagT-=dt;
    this.radioTick(dt);
    if(this.sc.state!=='off'||this.yellow.t>0)for(const c of this.cars)c.lapSC=true;
  }
  for(const c of this.cars)if(!c.gone)this.control(c,dt);
  for(const c of this.cars)if(!c.gone)this.integrate(c,dt);
  if(this.mode==='race')this.collisions();
  this.bookkeeping(dt);
  const o={};
  for(const c of this.cars)if(!c.gone){c.s=T.wrap(c.dist+T.startS);T.pos(c.s,c.d,o);c.x=o.x;c.y=o.y;
    c.heading=o.th+clamp(Math.atan2(c.vlat+c.bump,Math.max(60,c.v)),-.5,.5)*.8+c.spinYaw;if(c.inPit&&c.pit.ph>0)c.lapSC=true;}
  const S=this.sc;if(S.state!=='off'){T.pos(T.wrap(S.dist+T.startS),S.d,o);S.x=o.x;S.y=o.y;S.heading=o.th;}
};
World.prototype.scStep=function(dt){
  const S=this.sc;if(S.state==='off')return;
  S.t+=dt;
  const lead=this.order.find(c=>!c.dnf&&!c.finished&&!c.gone);
  if(!lead){S.state='off';return;}
  const rp=this.relPos(S.dist);
  if(S.state==='on'||S.state==='ending'){
    S.vis=Math.min(1,S.vis+dt*1.2);
    let v=CFG.SC_SPEED;const gap=this.normDs(lead.dist,S.dist);
    if(gap>380)v=CFG.SC_SPEED*.6;else if(gap<0)v=CFG.SC_SPEED*1.25;
    S.v+=clamp(v-S.v,-120*dt,120*dt);
    if(S.state==='ending'&&rp>=this.PIT_IN&&rp<0)S.d+=clamp(this.pitD1-S.d,-70*dt,70*dt);
    else if(S.state==='on')S.d+=(this.T.at(this.T.lineD,this.T.wrap(S.dist+this.T.startS))*.4-S.d)*Math.min(1,dt*2);
    if(S.state==='ending'&&rp>=this.PIT_LIM0&&rp<0){S.state='restart';this.log('Машина безопасности заехала в боксы — готовимся к рестарту','sc');
      const lc=lead;this.sayLater(.5,'restart',lc,'drv',1,null,.9);
      const other=this.cars.filter(x=>x!==lc&&!x.dnf);if(other.length)this.sayLater(2,'restart',other[Math.floor(this.rng()*other.length)],'drv',1,null,.7);}
  }else if(S.state==='restart'){
    S.v=CFG.PIT_LIMIT;S.d+=clamp(this.pitD1-S.d,-70*dt,70*dt);
    if(rp>this.PIT_LIM1)S.vis=Math.max(0,S.vis-dt*1.5);
  }
  S.dist+=S.v*dt;
};
World.prototype.integrate=function(c,dt){
  const T=this.T,st=c.st,D=c.D;
  const k=T.at(T.ks,c.s);
  if(c.dnf){
    c.v=Math.max(0,c.v-c.wreckDec*dt);
    const arrive=Math.abs(c.tgt-c.d);
    const rate=c.wreckDec>200?120:70;
    c.d+=clamp((c.tgt-c.d)*3,-rate,rate)*dt*(c.v>1||arrive>2?1:0);
    c.dist+=c.v*dt;c.braking=c.v>1;c.vlat=0;c.bump*=Math.exp(-4*dt);
    if(c.v<1&&this.tick%25===0&&c.dnfT<20)this.fx.push({type:'smoke',x:c.x,y:c.y});
    return;
  }
  if(st.spinT>0){
    st.spinT-=dt;c.v*=Math.max(0,1-1.6*dt);c.spinYaw+=2*Math.PI/1.7*dt;
    if(st.spinT<=0)c.spinYaw=0;
    c.d+=(k>=0?-1:1)*12*dt;
  }else{
    if(c.v<c.vT){let a=CFG.ACC*c.accMul*(1-Math.pow(c.v/Math.max(100,c.vtopEff),2));a=Math.max(a,10);if(c.off)a*=.5;c.v=Math.min(c.vT,c.v+a*dt);c.braking=false;}
    else{const dec=clamp((c.v-c.vT)*30,0,CFG.BRAKE_MAX*c.brakeMul);c.v=Math.max(c.vT,c.v-dec*dt);c.braking=dec>60;}
    const maxLat=(24+22*D.agil)*(1-.3*clamp(c.v/340,0,1))*(c.inPit?3.4:1);
    const vl=clamp((c.tgt-c.d)*3.2,-maxLat,maxLat);
    const la=(c.inPit?460:240)*dt;c.vlat+=clamp(vl-c.vlat,-la,la);
    if(T.bumpy>0)c.bump+=gauss(this.rng)*T.bumpy*45*Math.sqrt(dt)*clamp(c.v/300,0,1);
    c.d+=(c.vlat+c.bump)*dt;
    const out=k>=0?-1:1;let drift=0;
    if(st.mistT>0)drift+=st.mistDrift;
    if(c.over>1.05)drift+=(c.over-1.05)*600;
    c.d+=out*drift*dt*(Math.abs(k)>.0008?1:.3);
  }
  c.bump*=Math.exp(-4*dt);
  const lim=CFG.W/2+(c.inPit?70:28);c.d=clamp(c.d,-lim,lim);
  c.dist+=c.v/Math.max(.35,1-c.d*k)*dt;
  c.tyreW+=(c.v*dt/T.L)/(c.lifeNow||30)*c.wearRate;
  const off=!c.inPit&&Math.abs(c.d)>CFG.W/2+2;
  if(off&&!c.off2&&this.phase==='race'&&!c.finished&&this.mode==='race'){
    c.offCount++;c.stats.offs++;
    if(c.offCount%3===0){c.penalty+=5;this.stats.pens++;this.log('Штраф +5с '+c.name+': нарушение границ трассы','pen');}
    else this.log(c.name+' выехал за пределы трассы','warn');
  }
  c.off2=off;
  if(off&&c.v>80&&this.tick%3===0)this.fx.push({type:'dust',x:c.x,y:c.y});
};
World.prototype.collisions=function(){
  const cars=this.cars,T=this.T,L=T.L,CL=CFG.CAR_L,CW=CFG.CAR_W;
  for(let i=0;i<cars.length;i++){
    const a=cars[i];if(a.gone||a.dnf||a.pit.ph>0)continue;
    for(let j=i+1;j<cars.length;j++){
      const b=cars[j];if(b.gone||b.dnf||b.pit.ph>0)continue;
      let ds=b.dist-a.dist;ds-=Math.round(ds/L)*L;
      if(Math.abs(ds)>CL)continue;
      const k=T.at(T.ks,a.s),real=ds*Math.max(.4,1-.5*(a.d+b.d)*k),dd=b.d-a.d;
      const penLong=CL*.97-Math.abs(real),penLat=CW*.96-Math.abs(dd);
      if(penLong<=0||penLat<=0)continue;
      const key=i*16+j,fresh=!this.ccd[key]||this.t-this.ccd[key]>3;
      const front=real>0?b:a,rear=real>0?a:b;
      let hit=false,rv=0;
      if(penLat<penLong*.55){
        const dir=dd>=0?1:-1;
        a.d-=dir*penLat*.5;b.d+=dir*penLat*.5;a.bump-=dir*14;b.bump+=dir*14;a.v*=.995;b.v*=.995;
        hit=penLat>3;rv=Math.abs(a.v-b.v);
      }else{
        rv=Math.max(0,rear.v-front.v);
        rear.dist-=penLong*.7;
        rear.v=Math.max(0,Math.min(rear.v,front.v*.97));front.v+=Math.min(12,rv*.15);
        hit=rv>14;
        if(fresh&&rv>28&&rear.st.spinT<=0&&front.st.spinT<=0&&this.phase==='race'&&this.sc.state==='off'){rear.penalty+=5;this.stats.pens++;this.log('Штраф +5с '+rear.name+': столкновение с '+front.name,'pen');}
        if(rv>55){front.st.mistT=.8;front.st.mistV=.9;front.st.mistDrift=25;front.st.mistKind='wide';}
      }
      if(hit&&fresh){
        this.ccd[key]=this.t;a.stats.contacts++;b.stats.contacts++;this.stats.contacts++;
        this.log('Касание: '+a.name+' и '+b.name,'hit');
        this.fx.push({type:'spark',x:(a.x+b.x)/2,y:(a.y+b.y)/2});
        a.tyreW+=.01;b.tyreW+=.01;
        this.say('contact',a,'drv',1,{n:b.name},.6);this.say('contact',b,'drv',1,{n:a.name},.6);
        if(rv>62&&this.phase==='race'&&this.sc.state==='off'){
          if(this.rng()<(this.raceT<16?.08:.3))this.incident(rear,'crash','Столкновение с '+front.name);
          else{rear.st.spinT=1.4;front.st.mistT=1;front.st.mistV=.85;front.st.mistDrift=30;front.st.mistKind='wide';}
        }
      }
    }
  }
};
World.prototype.perLap=function(c){
  const D=c.D,rng=this.rng;
  c.wear+=Math.pow(1-D.dur,1.2)*.0009*c.dayW;
  c.lapSC=false;
  if(this.mode!=='race')return;
  if(c.trouble>0){c.troubleLaps--;if(c.troubleLaps<=0){c.trouble=0;this.log(c.name+' восстановил темп','info');}}
  else if(c.lapIdx<this.laps-1&&rng()<(1-D.rel)*.045*c.dayR){c.trouble=1;c.troubleLaps=2+Math.floor(rng()*3);this.log('Проблемы с машиной у '+c.name+' — теряет скорость','err');this.say('fail',c,'eng',1,null,.5);}
  if(!c.finished&&!c.dnf&&!c.pit.ph&&this.laps-c.lapIdx>2&&rng()<(1-D.rel)*.002*c.dayR*(this.laps>=35?1:1.2))this.incident(c,'fail');
  this.decidePit(c,false);
  if(c.tyreW>.72&&!c.pit.want&&!c.pit.ph){this.say('tyres',c,rng()<.5?'eng':'drv',0,null,.35);}
  const ahead=this.order[c.pos-2];
  if(ahead&&!ahead.finished&&c.pos>1&&this.normDs(c.dist,ahead.dist)<110&&!c.pit.ph)this.say('push',c,'eng',0,{n:c.name},.3);
};
World.prototype.onPass=function(w,l){
  w.stats.ovt++;l.stats.lost++;this.stats.passes++;
  if(this.raceT<3)return;
  const key=Math.min(w.id,l.id)*16+Math.max(w.id,l.id);
  if(this.pcd[key]&&this.t-this.pcd[key]<4)return;
  this.pcd[key]=this.t;
  this.updateOrder();
  if(w.pit.ph||l.pit.ph||w.dnf||l.dnf)return;
  this.log(w.name+' обходит '+l.name+' (P'+w.pos+')',w.pos===1?'lead':'pass');
  if(w.team!==l.team){this.say('pass',w,'drv',0,{n:l.name},.35);this.sayLater(2,'lost',l,'drv',0,{n:w.name},.25);}
};
World.prototype.bookkeeping=function(dt){
  const L=this.T.L,cars=this.cars,S=this.sc;
  for(const c of cars){
    if(c.gone||c.dnf)continue;
    if(!c.crossed0&&c.dist>=0){c.crossed0=true;c.lapT0=this.t;}
    const li=Math.floor(c.dist/L);
    while(li>c.lapIdx){
      c.lapIdx++;
      const over=Math.max(0,c.dist-c.lapIdx*L)/Math.max(50,c.v);
      const now=this.t-over,lt=now-c.lapT0;c.lapT0=now;
      c.lapTimes.push(lt);c.lastLap=lt;
      if(!c.lapSC&&(!c.bestLap||lt<c.bestLap))c.bestLap=lt;
      c.stintLaps++;
      if(c.lapIdx>=2&&this.mode==='race'&&!c.lapSC){
        if(!this.bestLap||lt<this.bestLap){this.bestLap=lt;this.bestLapCar=c;this.refLap=lt*1.03;this.log('Лучший круг: '+c.name+' — '+fmtLap(lt),'fl');this.say('lap',c,'eng',0,{n:c.name},.5);}
      }
      this.perLap(c);
      if(this.mode==='race'){
        const lead=this.order.find(x=>!x.dnf&&!x.finished&&!x.gone);
        if(lead===c||(lead&&lead.lapIdx<c.lapIdx)){
          if(S.state==='on'){S.lapsLeft--;if(S.lapsLeft<=0){S.state='ending';this.log('Машина безопасности заходит в боксы в конце круга','sc');}}
          else if(S.state==='restart'){S.state='off';S.vis=0;this.flagT=4;this.log('Зелёный флаг! Гонка возобновляется','lead');}
        }
        if(c.lapIdx>=this.laps||this.chequered){
          if(!c.finished){
            c.finished=true;c.finishT=now;c.raceTime=now-this.goT;c.finLaps=c.lapIdx;c.finishPos=++this.finCount;
            c.pit.want=false;
            if(!this.chequered){this.chequered=true;this.log('ПОБЕДИТЕЛЬ: '+c.name+'! Клетчатый флаг','lead');this.say('win',c,'drv',2);}
            else{this.log(c.name+' финиширует P'+c.finishPos,'info');if(c.finishPos<=3)this.say('podium',c,'drv',2,null,.9);else if(c.finishPos>=8)this.say('low',c,'drv',1,null,.5);}
          }
        }
      }else if(c.lapIdx>=this.laps&&!c.finished){c.finished=true;c.finishT=now;c.raceTime=now-this.goT;c.finLaps=c.lapIdx;}
    }
    if(c.finished&&this.mode==='race'){c.coolT+=dt;if(c.coolT>14)c.gone=true;}
  }
  // обгоны
  if(this.mode==='race'&&this.phase==='race'){
    for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){
      const a=cars[i],b=cars[j];if(a.finished||b.finished||a.dnf||b.dnf)continue;
      const key=i*16+j,ds=a.dist-b.dist,s0=this.rel[key]||0;
      if(s0===0){if(Math.abs(ds)>20)this.rel[key]=ds>0?1:-1;}
      else if(s0===1&&ds<-14){this.rel[key]=-1;this.onPass(b,a);}
      else if(s0===-1&&ds>14){this.rel[key]=1;this.onPass(a,b);}
    }
  }
  if(this.mode==='race'&&!this.done&&this.phase==='race'&&this.chequered&&cars.every(c=>c.finished||c.dnf||c.gone)){this.done=true;this.finalize();}
};
World.prototype.finalize=function(){
  const pts=[25,18,15,12,10,8,6,4,2,1];
  const fin=this.cars.filter(c=>!c.dnf&&c.finLaps>0);
  const dnf=this.cars.filter(c=>c.dnf||c.finLaps===0);
  fin.sort((a,b)=>(b.finLaps-a.finLaps)||((a.raceTime+a.penalty)-(b.raceTime+b.penalty)));
  dnf.sort((a,b)=>b.lapIdx-a.lapIdx||b.dist-a.dist);
  const res=[];let win=null;
  fin.forEach((c,i)=>{const total=c.raceTime+c.penalty;if(!win)win=total;res.push({c,pos:i+1,total,laps:c.finLaps,down:fin[0].finLaps-c.finLaps,gap:total-win,pts:pts[i]||0,dnf:false});});
  const PK=(this.T.def&&this.T.def.ptsK)||1;
  dnf.forEach((c,i)=>res.push({c,pos:fin.length+i+1,total:0,laps:c.lapIdx,down:0,gap:0,pts:0,dnf:true}));
  if(this.bestLapCar){const r=res.find(x=>x.c===this.bestLapCar);if(r&&!r.dnf&&r.pos<=10)r.pts+=1;}
  if(PK>1)res.forEach(r=>{r.pts*=PK;});
  this.results=res;this.log('Гонка завершена','lead');
};

function toast(t,color){const e=$('toast');e.textContent=t;e.style.color=color||'#fff';e.classList.add('show');toastT=3.5;}
function setCam(m){camMode=m;document.querySelectorAll('[data-cm]').forEach(b=>b.classList.toggle('act',b.dataset.cm===m));}
function viewCX(){return cw>900?(cw-320)/2:cw/2;}

function updateCamera(rdt){
  const baseZ=clamp(cw/1150,.65,1.4);let tx=cam.x,ty=cam.y,tz=baseZ*zoomMul;
  const cars=world.cars.filter(c=>!c.gone);
  if(world.phase==='grid'||world.phase==='lights'){
    let sx=0,sy=0;cars.forEach(c=>{sx+=c.x;sy+=c.y;});tx=sx/cars.length;ty=sy/cars.length;tz=baseZ*.9*zoomMul;
  }else if(camMode==='full'){
    tx=(bx0+bx1)/2;ty=(by0+by1)/2;tz=Math.min((cw>900?cw-340:cw)/(bx1-bx0+260),ch/(by1-by0+260))*zoomMul;
  }else{
    let f=null;
    if(camMode==='follow'&&selId>=0&&!world.cars[selId].gone)f=world.cars[selId];
    else if(camMode==='leader'||camMode==='follow')f=world.order.find(c=>!c.gone&&!c.dnf)||world.order[0];
    if(f){tx=f.x+Math.cos(f.heading)*f.v*.12;ty=f.y+Math.sin(f.heading)*f.v*.12;}
    else{ // режиссёр
      if(world.lastIncident&&world.lastIncident!==dir.seenInc){dir.seenInc=world.lastIncident;dir.focusT=4.5;}
      dir.focusT-=rdt;
      if(dir.focusT>0&&dir.seenInc&&!dir.seenInc.gone){tx=dir.seenInc.x;ty=dir.seenInc.y;tz=baseZ*1.05*zoomMul;}
      else{
        const ord=world.order.filter(c=>!c.gone&&!c.finished&&!c.dnf);
        dir.hold-=rdt;
        if(ord.length>1){
          let cur=dir.pair&&ord.includes(dir.pair[0])&&ord.includes(dir.pair[1])?dir.pair:null;
          const gapOf=p=>Math.abs(p[0].dist-p[1].dist);
          if(!cur||dir.hold<=0||gapOf(cur)>260){
            let best=null,bs=1e9;
            for(let i=0;i<ord.length-1;i++){const sc=(ord[i].dist-ord[i+1].dist)+i*18;if(sc<bs){bs=sc;best=[ord[i],ord[i+1]];}}
            if(best&&(!cur||best[0]!==cur[0]||best[1]!==cur[1])){dir.pair=best;dir.hold=7;}
            else if(!cur){dir.pair=best;dir.hold=7;}
          }
          const p=dir.pair||[ord[0],ord[1]];
          tx=(p[0].x+p[1].x)/2;ty=(p[0].y+p[1].y)/2;
        }else{const w=world.order.find(c=>!c.gone)||world.order[0];tx=w.x;ty=w.y;}
      }
    }
  }
  const k=1-Math.exp(-rdt*3.2);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;cam.z+=(tz-cam.z)*k;
}
function drainFx(){
  for(const f of world.fx){
    if(f.type==='spark')for(let i=0;i<10;i++){const a=Math.random()*6.28,s=60+Math.random()*120;parts.push({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4,m:.4,r:1.6,c:'#ffd24a',t:'s'});}
    else if(f.type==='smoke')parts.push({x:f.x,y:f.y,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,l:.9,m:.9,r:5,c:'#eee',t:'m'});
    else if(f.type==='dust')parts.push({x:f.x+(Math.random()-.5)*10,y:f.y+(Math.random()-.5)*10,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,l:.7,m:.7,r:4,c:'#cdb87a',t:'m'});
  }
  world.fx.length=0;
  while(parts.length>400)parts.shift();
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawBus(c,now){
  const L=CFG.CAR_L,Wd=CFG.CAR_W,col=TEAMS[c.team].color,tc=TYRES[c.comp].color;

  ctx.fillStyle=c.dnf?'#cfd3d9':'#f7f8fa';rr(ctx,-L/2,-Wd/2,L,Wd,4);ctx.fill();ctx.strokeStyle='#aab2bd';ctx.lineWidth=.8;ctx.stroke();
  ctx.fillStyle='#e9edf2';rr(ctx,L/2-9,-Wd/2+1.5,8.5,Wd-3,2.5);ctx.fill();
  ctx.fillStyle='#2a3f5f';ctx.fillRect(L/2-11.5,-Wd/2+2,2.6,Wd-4);
  ctx.strokeStyle='#cfd5dc';ctx.lineWidth=.7;
  for(let x=-L/2+6;x<L/2-14;x+=6){ctx.beginPath();ctx.moveTo(x,-Wd/2+1);ctx.lineTo(x,Wd/2-1);ctx.stroke();}

  if(!c.second)ctx.fillRect(-L/2+2,-2.2,L-14,4.4);
  else{ctx.fillRect(-L/2+2,-3.4,L-14,1.9);ctx.fillRect(-L/2+2,1.5,L-14,1.9);}
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(-1,0,5.6,0,6.283);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=.9;ctx.stroke();
  ctx.save();ctx.translate(-1,.3);ctx.rotate(Math.PI/2);ctx.fillStyle='#fff';ctx.font='bold 6.5px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.num,0,0);ctx.restore();
  const bl=Math.floor(now/250)%2;
  if(c.dnf){ctx.fillStyle=bl?'#ffb400':'#553a00';ctx.fillRect(L/2-14,-Wd/2+1.5,2.2,2.2);ctx.fillRect(L/2-14,Wd/2-3.7,2.2,2.2);ctx.fillRect(-L/2+1,-Wd/2+1.5,2.2,2.2);ctx.fillRect(-L/2+1,Wd/2-3.7,2.2,2.2);}
  else{
    ctx.fillStyle=bl?'#ffb400':'#6b4a00';ctx.fillRect(L/2-14,-Wd/2+1.5,1.8,1.8);ctx.fillRect(L/2-14,Wd/2-3.3,1.8,1.8);
    ctx.fillStyle=bl?'#6b0000':'#ff2020';ctx.fillRect(-L/2+1,-Wd/2+1.5,1.8,1.8);ctx.fillRect(-L/2+1,Wd/2-3.3,1.8,1.8);
    ctx.fillStyle='#fff6b0';ctx.fillRect(L/2-1.8,-Wd/2+2,1.8,2.2);ctx.fillRect(L/2-1.8,Wd/2-4.2,1.8,2.2);
    ctx.fillStyle=c.braking?'#ff4040':'#a01818';ctx.fillRect(-L/2,-Wd/2+2,1.6,3);ctx.fillRect(-L/2,Wd/2-5,1.6,3);
    if(c.braking){ctx.fillStyle='rgba(255,60,60,.35)';ctx.fillRect(-L/2-4,-Wd/2+1,4,Wd-2);}
  }
  ctx.fillStyle='#111';ctx.fillRect(L/2-11,-Wd/2-1.8,1.8,1.8);ctx.fillRect(L/2-11,Wd/2,1.8,1.8);
  if(c.id===selId){ctx.strokeStyle='#ffd24a';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,0,L*.72,0,6.283);ctx.stroke();}
  ctx.restore();
}
function drawSC(now){
  const S=world.sc;if(S.state==='off'||S.vis<=0)return;
  const L=CFG.CAR_L+4,Wd=CFG.CAR_W+2;
  ctx.save();ctx.globalAlpha=Math.min(1,S.vis);ctx.translate(S.x,S.y);ctx.rotate(S.heading);
  ctx.fillStyle='rgba(0,0,0,.3)';rr(ctx,-L/2+2,-Wd/2+3,L,Wd,5);ctx.fill();
  ctx.fillStyle='#f5c518';rr(ctx,-L/2,-Wd/2,L,Wd,5);ctx.fill();ctx.strokeStyle='#8a6d00';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#222';ctx.fillRect(L/2-12,-Wd/2+2,3,Wd-4);ctx.fillRect(-L/2+4,-Wd/2+2,12,Wd-4);
  ctx.fillStyle='#111';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.save();ctx.translate(2,0);ctx.rotate(Math.PI/2);ctx.fillText('SC',0,0);ctx.restore();
  const bl=Math.floor(now/160)%2;
  ctx.fillStyle=bl?'#ff7a00':'#7a3b00';ctx.fillRect(-2,-Wd/2+1,4,3.5);ctx.fillRect(-2,Wd/2-4.5,4,3.5);
  ctx.fillStyle=bl?'#4a90ff':'#ff3030';ctx.fillRect(-6,-3,3,6);
  ctx.restore();ctx.globalAlpha=1;
}
function render(now,rdt){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#2f6b2f';ctx.fillRect(0,0,cw,ch);
  const z=cam.z;
  ctx.save();ctx.translate(viewCX(),ch/2);ctx.scale(z,z);ctx.translate(-cam.x,-cam.y);
  ctx.fillStyle=grassPat;ctx.fillRect(bx0-3000,by0-3000,bx1-bx0+6000,by1-by0+6000);
  for(const t of trees){ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.arc(t.x+5,t.y+6,t.r,0,6.283);ctx.fill();ctx.fillStyle=t.sh<.5?'#1f5a25':'#2a6b2a';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,6.283);ctx.fill();ctx.fillStyle='rgba(120,200,100,.28)';ctx.beginPath();ctx.arc(t.x-t.r*.25,t.y-t.r*.25,t.r*.55,0,6.283);ctx.fill();}
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.strokeStyle='#c8b27a';ctx.lineWidth=CFG.W+66;ctx.stroke(pathC);
  ctx.setLineDash([]);
  ctx.strokeStyle='#cc2b2b';ctx.lineWidth=5;ctx.stroke(pathBL);ctx.stroke(pathBR);
  ctx.setLineDash([12,12]);ctx.strokeStyle='#fff';ctx.stroke(pathBL);ctx.stroke(pathBR);ctx.setLineDash([]);
  ctx.strokeStyle=TDEF&&TDEF.bumpy>.3?'#3a3733':'#2b2d31';ctx.lineWidth=CFG.W;ctx.stroke(pathC);
  ctx.strokeStyle='rgba(0,0,0,.14)';ctx.lineWidth=CFG.W*.4;ctx.stroke(pathC);
  ctx.strokeStyle='rgba(255,255,255,.92)';ctx.lineWidth=3;ctx.stroke(pathL);ctx.stroke(pathR);
  for(const kp of kerbs){ctx.lineWidth=7;ctx.strokeStyle='#d02c2c';ctx.stroke(kp);ctx.setLineDash([10,10]);ctx.strokeStyle='#fff';ctx.stroke(kp);ctx.setLineDash([]);}
  // пит-лейн
  if(pitPath){
    ctx.fillStyle='#4a4d55';ctx.fill(pitPath);ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.stroke(pitPath);
    for(const b of pitBoxes){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.th);ctx.fillStyle='#262a31';ctx.fillRect(-23,-4,46,34);ctx.fillStyle=TEAMS[b.team].color;ctx.fillRect(-23,24,46,6);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.2;ctx.strokeRect(-22,-30,44,26);ctx.restore();}
  }
  // старт-финиш и решётка
  {const o={};TRACK.pos(TRACK.startS,0,o);ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.th);
    for(let r=0;r<2;r++)for(let q=0;q<12;q++){ctx.fillStyle=(q+r)%2?'#111':'#fff';ctx.fillRect(r*6-6,-W2+q*(CFG.W/12),6,CFG.W/12);}
    if(world.phase==='grid'||world.phase==='lights'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1.5;
      for(let i=0;i<10;i++){const sl=-(14+Math.floor(i/2)*52+(i%2)*26),dd=i%2===0?22:-22;ctx.strokeRect(sl-CFG.CAR_L/2-2,dd-CFG.CAR_W/2-2,CFG.CAR_L+4,CFG.CAR_W+4);}}
    ctx.restore();}
  for(const s of stands){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.th);ctx.fillStyle='#3b3f4a';ctx.fillRect(-170,-14,340,28);
    for(let i=0;i<34;i++){ctx.fillStyle=['#e8c04a','#e05a5a','#5aa0e0','#f2f2f2'][i%4];ctx.fillRect(-168+i*10,-10,8,20);}
    ctx.restore();}
  for(const p of parts){p.x+=p.vx*rdt;p.y+=p.vy*rdt;p.l-=rdt;if(p.t==='m')p.r+=rdt*14;}
  for(let i=parts.length-1;i>=0;i--)if(parts[i].l<=0)parts.splice(i,1);
  for(const p of parts)if(p.t==='m'){ctx.globalAlpha=Math.max(0,p.l/p.m)*.55;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  const small=z<.45;
  const draw=world.order.slice().reverse();
  for(const c of draw){if(c.gone)continue;
    if(small){ctx.fillStyle=c.dnf?'#888':TEAMS[c.team].color;ctx.strokeStyle='#fff';ctx.lineWidth=2/z;ctx.beginPath();ctx.arc(c.x,c.y,9/z,0,6.283);ctx.fill();ctx.stroke();}
    else drawBus(c,now);}
  drawSC(now);
  for(const p of parts)if(p.t==='s'){ctx.globalAlpha=Math.max(0,p.l/p.m);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.r,p.r);}
  ctx.globalAlpha=1;
  ctx.restore();
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.font='bold 11px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  for(const c of world.order){if(c.gone)continue;
    const sx=(c.x-cam.x)*z+viewCX(),sy=(c.y-cam.y)*z+ch/2;
    if(sx<-60||sx>cw+60||sy<-40||sy>ch+40)continue;
    if(small){ctx.fillStyle='#fff';ctx.fillText(c.num,sx,sy+.5);}
    else if(z>.5){const t=(c.dnf?'✖ ':'P'+c.pos+' ')+c.name,w=ctx.measureText(t).width+24,y=sy-30*Math.max(.8,z);
      ctx.fillStyle='rgba(10,14,22,.72)';rr(ctx,sx-w/2,y-8,w,16,5);ctx.fill();ctx.fillStyle=TEAMS[c.team].color;ctx.fillRect(sx-w/2,y-8,3,16);
      ctx.fillStyle=TYRES[c.comp].color;ctx.beginPath();ctx.arc(sx+w/2-9,y,4.5,0,6.283);ctx.fill();ctx.strokeStyle='#000a';ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle='#fff';ctx.fillText(t,sx-5,y+.5);}
  }
}

// ================= UI: HUD, события, радио, результаты, управление =================
document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>setCam(b.dataset.cm));
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('act',x===b));});
$('bPause').onclick=()=>{paused=!paused;$('bPause').textContent=paused?'Продолжить':'Пауза';};
$('zp').onclick=()=>{zoomMul=Math.min(2.4,zoomMul*1.2);};
$('zm').onclick=()=>{zoomMul=Math.max(.4,zoomMul/1.2);};
$('bMenu').onclick=showMenu;
$('bRadio').onclick=()=>{radioOn=!radioOn;$('radiop').style.display=radioOn?'':'none';$('bRadio').textContent='Радио: '+(radioOn?'вкл':'выкл');};
$('bCrash').onclick=()=>{
  if(!world||world.phase!=='race'||world.chequered)return;
  const c=world.cars.filter(x=>!x.dnf&&!x.finished&&!x.gone&&!x.pit.ph);
  if(c.length>3)world.incident(c[Math.floor(Math.random()*c.length)],'crash','Ошибка в повороте');
};
addEventListener('wheel',e=>{if(e.target===cv)zoomMul=clamp(zoomMul*(e.deltaY<0?1.1:1/1.1),.4,2.4);},{passive:true});
addEventListener('keydown',e=>{
  if(inMenu)return;
  if(e.code==='Space'){e.preventDefault();$('bPause').click();}
  else if(e.key==='c'||e.key==='C'){const m=['auto','leader','follow','full'];setCam(m[(m.indexOf(camMode)+1)%4]);}
  else if(e.key==='+'||e.key==='=')$('zp').click();else if(e.key==='-')$('zm').click();
  else if('12345'.includes(e.key)&&e.key.length===1){const b=document.querySelectorAll('[data-sp]')[+e.key-1];if(b)b.click();}
});
cv.addEventListener('click',e=>{
  if(!world||inMenu)return;const z=cam.z,vx=viewCX();let best=null,bd=1e9;
  for(const c of world.cars){if(c.gone)continue;const sx=(c.x-cam.x)*z+vx,sy=(c.y-cam.y)*z+ch/2,d=Math.hypot(sx-e.clientX,sy-e.clientY);if(d<bd){bd=d;best=c;}}
  if(best&&bd<50){selId=best.id;setCam('follow');}
});
function drainEvents(){
  const lg=$('log');
  while(evPtr<world.events.length){
    const e=world.events[evPtr++];
    const d=document.createElement('div');d.className=e.kind;
    const m=Math.floor(Math.max(0,e.t)/60),s=Math.max(0,e.t)-m*60;
    d.textContent=m+':'+s.toFixed(0).padStart(2,'0')+'  '+e.text;
    lg.insertBefore(d,lg.firstChild);while(lg.children.length>40)lg.removeChild(lg.lastChild);
    if(['lead','fl','pen','hit','sc','crash','team'].includes(e.kind))toast(e.text,e.kind==='pen'||e.kind==='hit'||e.kind==='crash'?'#fca5a5':e.kind==='fl'?'#e0c2ff':e.kind==='sc'?'#fde68a':e.kind==='team'?'#99f6e4':'#ffe9a0');
  }
}
function drainRadio(){
  const box=$('radio');
  while(radPtr<world.radio.length){
    const m=world.radio[radPtr++];
    const d=document.createElement('div');d.className='msg '+m.who;d.dataset.t=m.t;
    const nm=m.who==='eng'?m.name:m.name+' (#'+m.num+')';
    d.innerHTML='<span class="tg" style="background:'+TEAMS[m.team].color+'">'+(m.who==='eng'?'ИНЖ':'#'+m.num)+'</span><div><span class="who">'+nm+'</span><div class="tx">«'+m.text+'»</div></div>';
    box.insertBefore(d,box.firstChild);while(box.children.length>4)box.removeChild(box.lastChild);
  }
  [...box.children].forEach((e,i)=>e.classList.toggle('old',i>1));
}
function gapText(c,lead,vref){
  if(c.dnf)return 'СХОД';
  if(c.finished){const dl=lead.finLaps-c.finLaps;return dl>0?'+'+dl+' кр':'FIN'+(c.penalty?' +'+c.penalty:'');}
  const L=TRACK.L,ld=Math.floor((lead.dist-c.dist)/L);
  if(ld>=1)return '+'+ld+' кр';
  return '+'+Math.max(0,(lead.dist-c.dist)/vref).toFixed(1);
}
function updateHUD(){
  const w=world,ord=w.order,lead=ord.find(c=>!c.dnf)||ord[0];
  const lapN=Math.min(w.laps,Math.max(1,Math.floor(Math.max(0,lead.dist)/TRACK.L)+1));
  $('lap').textContent=w.chequered?'Финиш':'Круг '+lapN+'/'+w.laps;
  const rt=Math.max(0,w.raceT);$('rtime').textContent=Math.floor(rt/60)+':'+(rt%60).toFixed(1).padStart(4,'0');
  $('flc').textContent=w.bestLapCar?'Лучший круг: '+w.bestLapCar.name+' '+fmtLap(w.bestLap):'Лучший круг: —';
  const lights=$('lights');
  if(w.phase==='lights'){lights.style.display='flex';[...lights.children].forEach((e,i)=>e.classList.toggle('on',i<w.lightsOn));}
  else if(w.phase==='race'&&w.raceT>2)lights.style.display='none';
  else if(w.phase==='race')[...lights.children].forEach(e=>e.classList.remove('on'));
  const fl=$('flag');let txt='',cls='';
  if(w.chequered&&!w.done){txt='Клетчатый флаг';cls='ch';}
  else if(w.sc.state==='on'||w.sc.state==='ending'){txt=w.sc.state==='on'?'Машина безопасности':'SC заходит в боксы';cls='sc';}
  else if(w.sc.state==='restart'){txt='Приготовиться к рестарту';cls='sc';}
  else if(w.yellow.t>0){txt='Жёлтые флаги';cls='y';}
  else if(w.flagT>0&&w.phase==='race'){txt='Зелёный флаг';cls='g';}
  if(txt&&w.phase==='race'){fl.textContent=txt;fl.className=cls;fl.style.display='block';lights.style.display='none';}else fl.style.display='none';
  const vref=TRACK.L/w.refLap;
  ord.forEach((c,i)=>{
    const e=rowEls[c.id];if(!e)return;
    e.style.transform='translateY('+(i*30)+'px)';
    e.classList.toggle('sel',c.id===selId);e.classList.toggle('out',c.dnf);
    const ch=e.children;ch[0].textContent=i+1;
    const ty=ch[3];ty.textContent=TYRES[c.comp].key;ty.style.borderColor=TYRES[c.comp].color;ty.classList.toggle('pit',c.pit.ph>0);
    ty.title=TYRES[c.comp].name+', износ '+Math.round(Math.min(1.2,c.tyreW)*100)+'%, стопов: '+c.pits;
    ch[4].textContent=i===0&&!c.finished&&!c.dnf?(w.phase==='race'?'лидер':''):(w.phase==='race'||c.dnf?gapText(c,lead,vref):'');
    const dlt=c.gridPos-(i+1);
    ch[5].innerHTML=w.phase==='race'&&dlt&&!c.dnf?'<span class="'+(dlt>0?'up':'dn')+'">'+(dlt>0?'▲':'▼')+Math.abs(dlt)+'</span>':'';
  });
}
function showResults(){
  const r=world.results;shownResults=true;
  let h='<h1>Итоги гонки — '+curDef.name+'</h1><div class="win">🏆 '+r[0].c.name+' — '+TEAMS[r[0].c.team].name+'</div><table><tr><th>#</th><th>Гонщик</th><th class="r">Время / отставание</th><th class="r">Штраф</th><th class="r">Лучший круг</th><th class="r">Старт→Финиш</th><th>Шины</th><th class="r">Обгонов</th><th class="r">Очки</th></tr>';
  r.forEach(x=>{const c=x.c,dlt=c.gridPos-x.pos;
    const tyres=c.used.map(tdot).join('');
    const tm=x.dnf?'<span class="dn">СХОД ('+(c.dnfKind==='crash'?'авария':'поломка')+'), '+x.laps+' кр</span>':x.pos===1?fmtLap(x.total):(x.down>0?'+'+x.down+' кр':'+'+x.gap.toFixed(3));
    h+='<tr><td>'+(x.dnf?'—':x.pos)+'</td><td><span class="chipS" style="background:'+TEAMS[c.team].color+'"></span>'+c.name+'</td><td class="r">'+tm+'</td><td class="r">'+(c.penalty?'+'+c.penalty+'с':'—')+'</td><td class="r" '+(world.bestLapCar===c?'style="color:#c78bff"':'')+'>'+(c.bestLap?fmtLap(c.bestLap):'—')+'</td><td class="r">'+c.gridPos+' → '+(x.dnf?'DNF':x.pos+(dlt>0?' <span class="up">▲'+dlt+'</span>':dlt<0?' <span class="dn">▼'+(-dlt)+'</span>':''))+'</td><td>'+tyres+' <small>('+c.pits+')</small></td><td class="r">'+c.stats.ovt+'</td><td class="r">'+x.pts+'</td></tr>';});
  h+='</table>';
  const tp=TEAMS.map((t,i)=>({t,p:r.filter(x=>x.c.team===i).reduce((a,x)=>a+x.pts,0)})).sort((a,b)=>b.p-a.p);
  h+='<p class="sub" style="margin-top:14px">Кубок конструкторов: '+tp.map(x=>'<b style="color:'+x.t.color+'">'+x.t.name+' '+x.p+'</b>').join(' · ')+'</p>';
  const s=world.stats;
  h+='<p class="sub">Обгонов: '+s.passes+' · касаний: '+s.contacts+' · ошибок: '+s.errs+' · штрафов: '+s.pens+' · пит-стопов: '+s.pits+' · машина безопасности: '+s.sc+' · сходов: '+s.dnf+' · командных приказов: '+s.swaps+'</p>';
  h+='<div class="btns"><button class="go" id="nr">🎲 Новая гонка (эта трасса)</button><button id="rp">↻ Повторить с тем же сидом</button><button id="nt">🏁 Другая трасса</button><button id="cl">Закрыть</button></div>';
  const box=$('res').querySelector('.box');box.innerHTML=h;$('res').style.display='flex';
  $('nr').onclick=()=>startWeekend(curDef,Math.floor(Math.random()*1e9));$('rp').onclick=()=>startWeekend(curDef,seed);$('nt').onclick=showTracks;$('cl').onclick=()=>{$('res').style.display='none';};
}
let last=performance.now();
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  if(world&&TRACK){
    if(!paused&&!inMenu&&world.phase!=='grid'){
      acc+=rdt*speed;let n=0;
      while(acc>=CFG.DT&&n<900){world.step(CFG.DT);acc-=CFG.DT;n++;}
      if(n>=900)acc=0;
    }
    drainFx();drainEvents();drainRadio();
    updateCamera(rdt);render(now,rdt);drawMini();
    hudT-=rdt;if(hudT<=0){hudT=.12;updateHUD();}
    if(toastT>0){toastT-=rdt;if(toastT<=0)$('toast').classList.remove('show');}
    if(world.done&&!shownResults){if(!doneAt)doneAt=world.t;if(world.t-doneAt>3)showResults();}
  }
  requestAnimationFrame(frame);
}
buildAssets(TRACKS[0]);
showMenu();
requestAnimationFrame(frame);

</script>
</body>
</html>
